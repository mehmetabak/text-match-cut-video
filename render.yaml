services:
  # 1. FastAPI Web API
  - type: web
    name: matchcut-api
    env: docker
    region: frankfurt
    plan: free
    dockerContext: ./render-worker
    dockerfilePath: ./render-worker/Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WORKER_API_KEY
        generateValue: true
